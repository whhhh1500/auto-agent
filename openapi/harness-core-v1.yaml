      "CapabilityManifest": {"type": "object", "required": ["id", "version", "name", "kind"], "description": "Language-neutral core.CapabilityManifest. input_schema, output_schema and tool.parameters retain JSON Schema-like payloads without narrowing them to one provider dialect. A subagent binding may set metadata subagent.max_depth (1–64), subagent.max_children (1–256), and subagent.max_tool_calls (1–1024); other subagent.* keys are rejected.", "properties": {"id": {"type": "string"}, "version": {"type": "string"}, "name": {"type": "string"}, "description": {"type": "string"}, "kind": {"type": "string", "enum": ["knowledge", "rag", "prompt", "context", "tool", "plugin", "agent", "computation", "connector", "skill", "workflow", "memory", "router", "policy", "hook", "evaluator", "model", "sandbox", "presentation"]}, "contract": {"type": "string"}, "required_permissions": {"type": "array", "items": {"type": "string"}}, "required_credentials": {"type": "array", "items": {"type": "string", "description": "Credential reference only; never a secret value."}}, "input_schema": {"type": "object", "additionalProperties": true}, "output_schema": {"type": "object", "additionalProperties": true}, "max_output_bytes": {"type": "integer", "minimum": 0}, "per_turn_budget": {"type": "integer", "minimum": 0}, "timeout_ms": {"type": "integer", "minimum": 0}, "idempotent": {"type": "boolean"}, "requires_approval": {"type": "boolean"}, "tool": {"$ref": "#/components/schemas/ToolExposure"}, "execution": {"$ref": "#/components/schemas/ExecutionSpec"}, "metadata": {"type": "object", "additionalProperties": {"type": "string"}}}, "additionalProperties": false},
      "CapabilityBindExecution": {"type": "object", "required": ["runtime"], "description": "Runtime selector. Omitted runtime defaults to built-in http; built-ins are http, runner and subagent, while installed plugins use a bounded id@version selector. runtime_implementation_revision is internal journal evidence and is not a request field.", "properties": {"runtime": {"type": "string", "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}(@[A-Za-z0-9][A-Za-z0-9._-]{0,31})?$", "maxLength": 96, "description": "Built-in runtime id or plugin id@version; defaults to http when omitted by legacy clients."}, "entrypoint": {"type": "string", "description": "HTTP absolute URL for http; namespaced child Profile ID for subagent; plugin-defined for extensions."}, "workdir": {"type": "string", "description": "Plugin-defined execution field."}, "sandbox": {"type": "object", "additionalProperties": true, "description": "Plugin-defined execution field."}, "writes": {"type": "boolean", "description": "Plugin-defined execution field."}, "method": {"type": "string", "description": "HTTP/plugin-defined; rejected by runner and subagent."}, "headers": {"type": "object", "additionalProperties": {"type": "string"}, "description": "HTTP/plugin-defined; values must be public literals or credential references."}}, "allOf": [{"if": {"properties": {"runtime": {"const": "subagent"}}}, "then": {"required": ["entrypoint"]}}], "additionalProperties": false},
