{
  "openapi": "3.1.0",
  "info": {
    "title": "Harness Core HTTP API",
    "version": "v1",
    "description": "Versioned SaaS HTTP/SSE contract for the routes registered by pkg/server. Tenant and subject ownership are resolved from the authenticated Principal; cross-tenant session access is intentionally reported as 404. This pre-GA v1 contract accepts additive fields and routes, while semantic or breaking changes require a new reviewed contract revision. Operations marked x-harness-contract-first are approved control-plane contracts whose server registration is verified before they can be considered implemented. Optional adapters return the documented 501 error when they are not configured."
  },
  "servers": [{"url": "/"}],
  "tags": [
    {"name": "sessions"}, {"name": "runs"}, {"name": "profiles"},
    {"name": "admin"}, {"name": "runner"}, {"name": "resources"}
  ],
  "paths": {
    "/healthz": {"get": {"operationId": "health", "summary": "Process health", "responses": {"200": {"description": "healthy"}}}},
    "/readyz": {"get": {"operationId": "ready", "summary": "Dependency readiness", "responses": {"200": {"description": "ready"}, "503": {"$ref": "#/components/responses/Error"}}}},
    "/v1/auth/login": {"post": {"operationId": "login", "tags": ["admin"], "summary": "Create a built-in account bearer token", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginRequest"}}}}, "responses": {"200": {"description": "token issued", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginResponse"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}}},
    "/v1/auth/logout": {"post": {"operationId": "logout", "tags": ["admin"], "security": [{"BearerAuth": []}], "responses": {"200": {"description": "token revoked or development session ended", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Status"}}}}, "401": {"$ref": "#/components/responses/Error"}}}},
    "/v1/auth/activate": {"post": {"operationId": "activateInitialAccount", "tags": ["admin"], "security": [{"BearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ActivationRequest"}}}}, "responses": {"200": {"description": "initial password replaced and normal token issued", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ActivationResponse"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}}}},
    "/v1/sessions": {
      "get": {"operationId": "listSessions", "tags": ["sessions"], "security": [{"BearerAuth": []}], "responses": {"200": {"description": "visible session catalog", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SessionList"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}},
      "post": {"operationId": "createSession", "tags": ["sessions"], "security": [{"BearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateSessionRequest"}}}}, "responses": {"201": {"description": "session created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Session"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}}}
    },
    "/v1/sessions/{id}": {"get": {"operationId": "getSession", "tags": ["sessions"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/SessionID"}], "responses": {"200": {"description": "owned session", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Session"}}}}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}}}},
    "/v1/sessions/{id}/events": {"get": {"operationId": "listSessionEvents", "tags": ["sessions"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/SessionID"}, {"$ref": "#/components/parameters/AfterSeq"}, {"$ref": "#/components/parameters/Limit"}], "responses": {"200": {"description": "Canonical persisted events. After an SSE disconnect, resume durable observation with next_after_seq as after_seq; this is a JSON replay endpoint, not an SSE replay endpoint.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EventList"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}}}},
    "/v1/sessions/{id}/runs": {
      "get": {"operationId": "listRuns", "tags": ["runs"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/SessionID"}], "responses": {"200": {"description": "durable runs for the session", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunList"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}},
      "post": {"operationId": "runTurn", "tags": ["runs"], "summary": "Run one synchronous turn as server-sent events", "security": [{"BearerAuth": []}], "x-harness-reconnect": "The SSE stream has no event IDs, Last-Event-ID support, or server-side replay. On disconnect, use GET /v1/sessions/{id}/events with after_seq to retrieve durable events, then inspect GET run state when configured.", "parameters": [{"$ref": "#/components/parameters/SessionID"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunRequest"}}}}, "responses": {"200": {"description": "SSE stream. Event names are persisted session event types; control/store errors use the same Error payload.", "content": {"text/event-stream": {"schema": {"$ref": "#/components/schemas/SSEEvent"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
    },
    "/v1/sessions/{id}/runs/async": {"post": {"operationId": "enqueueRun", "tags": ["runs"], "summary": "Enqueue a durable run", "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/SessionID"}, {"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunRequest"}}}}, "responses": {"202": {"description": "queued run; Location points to the same run and Idempotency-Replayed is returned for keyed replays", "headers": {"Location": {"schema": {"type": "string"}}, "Idempotency-Replayed": {"schema": {"type": "boolean"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunRecord"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}}},
    "/v1/sessions/{id}/runs/{runID}": {"get": {"operationId": "getRun", "tags": ["runs"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/SessionID"}, {"$ref": "#/components/parameters/RunID"}], "responses": {"200": {"description": "durable run record", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunRecord"}}}}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}}},
    "/v1/sessions/{id}/runs/{runID}/cancel": {"post": {"operationId": "cancelRun", "tags": ["runs"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/SessionID"}, {"$ref": "#/components/parameters/RunID"}], "responses": {"202": {"description": "cancellation requested", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CancelResponse"}}}}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}}},
    "/v1/sessions/{id}/cancel": {"post": {"operationId": "cancelActiveSessionRun", "tags": ["runs"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/SessionID"}], "responses": {"202": {"description": "active run cancellation requested", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CancelResponse"}}}}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles": {"get": {"operationId": "listProfiles", "tags": ["profiles"], "security": [{"BearerAuth": []}], "responses": {"200": {"description": "visible profiles", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Profiles"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}}}},
    "/v1/admin/profiles/{id}": {"get": {"operationId": "getAdminProfile", "tags": ["admin", "profiles"], "summary": "Resolve one profile's effective view at an owned scope", "x-harness-contract-first": true, "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}, {"$ref": "#/components/parameters/ScopeQuery"}], "responses": {"200": {"description": "The effective profile snapshot for the requested scope. A tenant operator may only request its tenant scope or a descendant; an account administrator may request any valid scope.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AdminProfileResponse"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "putAdminProfile", "tags": ["admin", "profiles"], "summary": "Create or replace one scoped AgentProfileLayer", "x-harness-contract-first": true, "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AdminProfileWriteRequest"}}}}, "responses": {"200": {"description": "The recomposed effective profile after the scoped layer is accepted.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AdminProfileResponse"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/capabilities": {"get": {"operationId": "listProfileCapabilities", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/capabilities": {"get": {"operationId": "listCapabilities", "tags": ["profiles"], "security": [{"BearerAuth": []}], "responses": {"200": {"description": "visible capability catalog", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Capabilities"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/publish": {"post": {"operationId": "publishProfile", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/releases": {"get": {"operationId": "listProfileReleases", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/releases/{version}": {"get": {"operationId": "getProfileRelease", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}, {"name": "version", "in": "path", "required": true, "schema": {"type": "integer"}}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/rollback": {"post": {"operationId": "rollbackProfile", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/canaries": {"get": {"operationId": "listCanaries", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}, "post": {"operationId": "stageCanary", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/canaries/{canaryID}": {"get": {"operationId": "getCanary", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}, {"name": "canaryID", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/canaries/{canaryID}/percentage": {"post": {"operationId": "setCanaryPercentage", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}, {"$ref": "#/components/parameters/CanaryID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/canaries/{canaryID}/pause": {"post": {"operationId": "pauseCanary", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}, {"$ref": "#/components/parameters/CanaryID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/canaries/{canaryID}/resume": {"post": {"operationId": "resumeCanary", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}, {"$ref": "#/components/parameters/CanaryID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/canaries/{canaryID}/rollback": {"post": {"operationId": "rollbackCanary", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}, {"$ref": "#/components/parameters/CanaryID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/profiles/{id}/canaries/{canaryID}/promote": {"post": {"operationId": "promoteCanary", "tags": ["profiles"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ProfileID"}, {"$ref": "#/components/parameters/CanaryID"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/resources": {"get": {"operationId": "listResources", "tags": ["resources"], "security": [{"BearerAuth": []}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/resources/{key}": {"get": {"operationId": "getResource", "tags": ["resources"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ResourceKey"}], "responses": {"200": {"description": "resource bytes", "content": {"application/octet-stream": {"schema": {"type": "string", "format": "binary"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "putResource", "tags": ["resources"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ResourceKey"}], "requestBody": {"required": true, "content": {"application/octet-stream": {"schema": {"type": "string", "format": "binary"}}}}, "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}, "delete": {"operationId": "deleteResource", "tags": ["resources"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ResourceKey"}], "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/runners/claim": {"post": {"operationId": "claimRunnerTask", "tags": ["runner"], "security": [{"RunnerBearer": []}], "requestBody": {"required": false, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunnerClaimRequest"}}}}, "responses": {"200": {"description": "one claimed task or no task", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunnerClaim"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}}},
    "/v1/runners/tasks/{id}/renew": {"post": {"operationId": "renewRunnerTask", "tags": ["runner"], "security": [{"RunnerBearer": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunnerGeneration"}}}}, "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/runners/tasks/{id}/complete": {"post": {"operationId": "completeRunnerTask", "tags": ["runner"], "security": [{"RunnerBearer": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunnerCompletion"}}}}, "responses": {"2XX": {"$ref": "#/components/responses/Success"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/v1/admin/approvals": {"get": {"operationId": "listApprovals", "tags": ["admin"], "summary": "Tenant-scoped approval inbox", "security": [{"BearerAuth": []}], "responses": {"200": {"description": "pending or historical approvals visible to an account or tenant administrator", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApprovalList"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}}},
    "/v1/admin/approvals/{approvalID}": {"get": {"operationId": "getApproval", "tags": ["admin"], "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ApprovalID"}], "responses": {"200": {"description": "one tenant-visible approval", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Approval"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}}},
    "/v1/admin/approvals/{approvalID}/decision": {"post": {"operationId": "decideApproval", "tags": ["admin"], "summary": "Resolve an approval; the durable queue resumes the same run ID", "description": "Approval records are tenant-visible only to tenant/account operators. A successful decision resumes or finalizes the existing run_id; it never creates a replacement run. The store transitions pending approvals to expired at expiry. Expired and already-resolved approvals reject a new decision with 409.", "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/ApprovalID"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApprovalDecision"}}}}, "responses": {"200": {"description": "resolved approval for the same run_id", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Approval"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}}}},
    "/v1/admin/notification-targets": {
      "get": {"operationId": "listNotificationTargets", "tags": ["admin"], "summary": "List non-secret notification targets for one tenant", "description": "Tenant operators may omit tenant_id to use their own tenant. Account administrators must provide tenant_id. Target configuration, endpoints, and credentials are never returned.", "security": [{"BearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/NotificationTargetTenantID"}], "responses": {"200": {"description": "non-secret target metadata", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/NotificationTargetListResponse"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "500": {"$ref": "#/components/responses/Error"}}},
      "post": {"operationId": "createNotificationTarget", "tags": ["admin"], "summary": "Create one tenant-scoped notification target", "description": "config is opaque provider-owned JSON accepted only for creation. It can contain secrets and is never included in any response.", "security": [{"BearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/NotificationTargetCreateRequest"}}}}, "responses": {"201": {"description": "created non-secret target metadata", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/NotificationTargetView"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "500": {"$ref": "#/components/responses/Error"}}},
      "put": {"operationId": "updateNotificationTarget", "tags": ["admin"], "summary": "Update one tenant-scoped notification target with revision fencing", "description": "config is optional only for metadata-preserving updates; when present it replaces the opaque provider configuration. config is never included in a response.", "security": [{"BearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/NotificationTargetUpdateRequest"}}}}, "responses": {"200": {"description": "updated non-secret target metadata", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/NotificationTargetView"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "500": {"$ref": "#/components/responses/Error"}}},
      "delete": {"operationId": "deleteNotificationTarget", "tags": ["admin"], "summary": "Delete one tenant-scoped notification target with revision fencing", "security": [{"BearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/NotificationTargetDeleteRequest"}}}}, "responses": {"200": {"description": "target deleted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Status"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "501": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "500": {"$ref": "#/components/responses/Error"}}}
    },
