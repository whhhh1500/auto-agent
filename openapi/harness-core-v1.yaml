      "Limit": {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 2000}},
      "RunID": {"name": "runID", "in": "path", "required": true, "schema": {"type": "string"}},
      "ProfileID": {"name": "id", "in": "path", "required": true, "description": "A safe 1-128-character profile ID. Built-in bare IDs such as general and namespaced IDs are both valid.", "schema": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"}},
      "CanaryID": {"name": "canaryID", "in": "path", "required": true, "schema": {"type": "string"}},
      "ApprovalID": {"name": "approvalID", "in": "path", "required": true, "schema": {"type": "string"}},
      "TaskID": {"name": "taskID", "in": "path", "required": true, "schema": {"type": "string"}},
      "ScopeQuery": {"name": "scope", "in": "query", "required": true, "description": "ScopePath as its JSON array encoding, URL encoded; e.g. [{\"kind\":\"tenant\",\"id\":\"acme\"}].", "schema": {"type": "string", "minLength": 1}},
      "ID": {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}},
      "Account": {"name": "account", "in": "path", "required": true, "schema": {"type": "string"}},
      "SettingKey": {"name": "key", "in": "path", "required": true, "schema": {"type": "string"}},
      "DatasetID": {"name": "datasetID", "in": "path", "required": true, "schema": {"type": "string"}},
      "Version": {"name": "version", "in": "path", "required": true, "schema": {"type": "integer"}},
      "EvaluationRunID": {"name": "evaluationRunID", "in": "path", "required": true, "schema": {"type": "string"}},
      "ResourceKey": {"name": "key", "in": "path", "required": true, "schema": {"type": "string"}, "description": "Slash-delimited resource key."},
      "NotificationTargetTenantID": {"name": "tenant_id", "in": "query", "required": false, "schema": {"type": "string"}, "description": "Optional for a tenant operator, which then uses its own tenant. Required for an account administrator; a tenant operator cannot select another tenant."},
      "IdempotencyKey": {"name": "Idempotency-Key", "in": "header", "required": false, "schema": {"type": "string", "maxLength": 256}}
    },
    "responses": {
      "Success": {"description": "Implemented successful response; exact payload varies by operation."},
      "Error": {"description": "Uniform JSON error envelope", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
