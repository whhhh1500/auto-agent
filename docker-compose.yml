# Development-only PostgreSQL and Harness environment. Do not use this file
# for production: replace credentials with a secret manager and use an
# immutable image digest plus a managed PostgreSQL service.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: harness_dev
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: dev-only-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  harness:
    build:
      context: .
      args:
        VERSION: dev-compose
        COMMIT: local
        BUILD_DATE: local
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        GOSUMDB: "${GOSUMDB:-sum.golang.org}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HARNESS_MODE: dev
      HARNESS_DATABASE_TYPE: postgres
      HARNESS_POSTGRES_DSN: postgres://harness:dev-only-change-me@postgres:5432/harness_dev?sslmode=disable
      HARNESS_SERVER_PORT: 8080
      HARNESS_DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - harness-data:/data

volumes:
  harness-data:
  postgres-data:
